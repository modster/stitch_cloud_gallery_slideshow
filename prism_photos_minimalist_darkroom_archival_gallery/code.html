  // Interactive Fullscreen Slideshow Component
  function SlideshowModal({ isOpen, onClose }) {
    const [currentIndex, setCurrentIndex] = useState(0);
    const [isPlaying, setIsPlaying] = useState(true);
    const [speed, setSpeed] = useState(5);

    useEffect(() => {
      let timer = null;
      if (isOpen && isPlaying) {
        timer = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % samplePhotos.length);
        }, speed * 1000);
      }
      return () => clearInterval(timer);
    }, [isOpen, isPlaying, speed]);

    if (!isOpen) return null;
    const current = samplePhotos[currentIndex];

    return (
      <div className="fixed inset-0 z-50 bg-[#07080a]/95 backdrop-blur-2xl flex flex-col justify-between p-4 sm:p-8 transition-opacity select-none">

            <div className="bg-surface-container-low rounded-xl p-6 shadow-md border border-surface-container flex flex-col gap-4">
              <h2 className="text-base font-bold text-on-surface">Public Bio & Portfolio Slugs</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="flex flex-col gap-1.5">
                  <label className="text-[10px] font-mono uppercase text-outline">Display Name</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full h-10 px-3 rounded-lg bg-surface-container text-xs text-on-surface focus:outline-none"
                  />
                </div>
                <div className="flex flex-col gap-1.5">
                  <label className="text-[10px] font-mono uppercase text-outline">Custom Portfolio URL</label>
                  <div className="flex items-center h-10 px-3 rounded-lg bg-surface-container text-xs">
                    <span className="text-outline font-mono">prism.gallery/</span>
                    <span className="text-primary font-mono ml-0.5">alexrivera</span>
                  </div>
                </div>
              </div>

              <div className="flex flex-col gap-1.5">
                <label className="text-[10px] font-mono uppercase text-outline">Artist Statement</label>
                <textarea
                  rows="3"
                  value={bio}
                  onChange={(e) => setBio(e.target.value)}
                  className="w-full p-3 rounded-lg bg-surface-container text-xs text-on-surface focus:outline-none resize-none"
                />
              </div>

              <div className="flex items-center justify-between p-3 rounded-lg bg-surface-container">
                <div className="flex flex-col">
                  <span className="text-xs font-semibold text-on-surface">Public EXIF Camera Metadata</span>
                  <span className="text-[10px] text-outline">Allow visitors to view focal length, ISO, and lens model</span>
                </div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    checked={exifEnabled}
                    onChange={() => setExifEnabled(!exifEnabled)}
                    className="sr-only peer"
                  />
                  <div className="w-10 h-5 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-secondary"></div>
                </label>
              </div>
            </div>
          </div>

          <div className="lg:col-span-5 flex flex-col gap-6">
            <div className="bg-surface-container-low rounded-xl p-6 shadow-md border border-surface-container flex flex-col gap-4">
              <h2 className="text-base font-bold text-on-surface">Security & Biometrics</h2>
              <div className="flex items-center justify-between p-3 rounded-lg bg-surface-container">
                <div className="flex flex-col">
                  <span className="text-xs font-semibold text-on-surface">TouchID / Biometric Vault</span>
                  <span className="text-[10px] text-outline">Require prompt to decrypt locked folios</span>
                </div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    checked={biometricEnabled}
                    onChange={() => setBiometricEnabled(!biometricEnabled)}
                    className="sr-only peer"
                  />
                  <div className="w-10 h-5 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-secondary"></div>
                </label>
              </div>

              <div className="p-3.5 rounded-lg bg-surface-container flex flex-col gap-2">
                <span className="text-xs font-semibold text-on-surface">Full Archival Export</span>
                <span className="text-[10px] text-outline">Download all 142 uncompressed originals with full XMP sidecars (.tar)</span>
                <button
                  onClick={() => alert("Packaging export archive... You will receive an encrypted notification.")}
                  className="w-fit px-3 py-1.5 rounded-lg bg-surface-container-high hover:bg-surface-bright text-xs text-on-surface font-semibold mt-1"
                >
                  Start Archival Export
                </button>
              </div>
            </div>
          </div>
        </div>

        {saveToast && (
          <div className="fixed bottom-10 right-10 bg-secondary text-on-secondary px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2 z-50 animate-bounce">
            <span className="material-symbols-outlined text-[18px]">check_circle</span>
            <span>Settings saved successfully!</span>
          </div>
        )}
      </div>
    );
  }

  // SCREEN 7: Private Vault Screen
  function VaultScreen({ onOpenAuth }) {
    const [unlocked, setUnlocked] = useState(false);
    const [pin, setPin] = useState("");
    const navigate = useNavigate();

    const handleUnlock = (e) => {
      e.preventDefault();
      if (pin === "1234" || pin === "") {
        setUnlocked(true);
      } else {
        alert("Incorrect PIN code. Hint: Use 1234 or leave blank.");
      }
    };

    if (!unlocked) {
      return (
        <div className="flex flex-col items-center justify-center min-h-[calc(100vh-8rem)] p-6 text-center">
          <div className="w-16 h-16 rounded-2xl bg-surface-container-high text-tertiary flex items-center justify-center mb-4 shadow-xl">
            <span className="material-symbols-outlined text-[32px]">lock</span>
          </div>
          <h1 className="text-2xl font-bold text-on-surface">Private Darkroom Vault</h1>
          <p className="text-xs text-on-surface-variant max-w-sm mt-1 mb-6">
            Encrypted storage containing 44 RAW frames, personal unreleased series, and experimental negatives.
          </p>
          <form onSubmit={handleUnlock} className="flex flex-col gap-3 w-full max-w-xs">
            <input
              type="password"
              placeholder="Enter Vault PIN (Hint: 1234)"
              value={pin}
              onChange={(e) => setPin(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl bg-surface-container text-center text-on-surface text-sm tracking-widest focus:outline-none border border-surface-container-high"
            />
            <button
              type="submit"
              className="w-full py-2.5 rounded-xl bg-tertiary text-on-tertiary text-xs font-bold shadow-md hover:bg-tertiary-fixed transition-colors"
            >
              Unlock Vault
            </button>
            <button
              type="button"
              onClick={onOpenAuth}
              className="text-xs text-outline hover:text-on-surface underline mt-2"
            >
              Authenticate via TouchID / Google
            </button>
          </form>
        </div>
      );
    }

    return (
      <div className="flex flex-col w-full px-6 lg:px-8 py-8 gap-6 max-w-6xl mx-auto pb-24">
        <div className="flex items-center justify-between border-b border-surface-container pb-4">
          <div className="flex items-center gap-3">
            <span className="material-symbols-outlined text-tertiary text-[24px]">lock_open</span>
            <div>
              <h2 className="text-xl font-bold text-on-surface">Private Vault Unlocked</h2>
              <p className="text-xs text-outline">Session active · 44 restricted files</p>
            </div>
          </div>
          <button
            onClick={() => setUnlocked(false)}
            className="px-3 py-1.5 rounded-lg bg-surface-container text-xs text-on-surface hover:bg-surface-bright"
          >
            Lock Vault
          </button>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          {samplePhotos.map((item) => (
            <div
              key={item.id}
              onClick={() => navigate(`/photo/${item.id}`)}
              className="group relative aspect-[3/4] rounded-xl overflow-hidden bg-surface-container cursor-pointer shadow-md"
            >
              <img src={item.url} alt={item.alt} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
              <div className="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-tertiary/20 text-tertiary text-[10px] font-mono">
                ENCRYPTED
              </div>
              <div className="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-3 flex flex-col justify-end">
                <span className="text-xs font-bold text-white truncate">{item.title}</span>
                <span className="text-[10px] text-outline font-mono">{item.specs}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Root App Component
  function App() {
    const [authModalOpen, setAuthModalOpen] = useState(false);
    const [slideshowOpen, setSlideshowOpen] = useState(false);

    return (
      <div className="min-h-screen bg-surface-container-lowest text-on-surface">
        <Sidebar />
        <Header
          onOpenAuth={() => setAuthModalOpen(true)}
          onStartSlideshow={() => setSlideshowOpen(true)}
        />

        <main className="lg:pl-64 pt-16 min-h-screen">
          <Routes>
            <Route path="/" element={<AllPhotosScreen onStartSlideshow={() => setSlideshowOpen(true)} />} />
            <Route path="/public-stream" element={<PublicStreamScreen onOpenAuth={() => setAuthModalOpen(true)} onStartSlideshow={() => setSlideshowOpen(true)} />} />
            <Route path="/compact-feed" element={<CompactFeedScreen onStartSlideshow={() => setSlideshowOpen(true)} />} />
            <Route path="/curator-showcase" element={<CuratorShowcaseScreen onStartSlideshow={() => setSlideshowOpen(true)} />} />
            <Route path="/photo/:id" element={<PhotoDetailScreen onStartSlideshow={() => setSlideshowOpen(true)} />} />
            <Route path="/profile-settings" element={<ProfileSettingsScreen />} />
            <Route path="/vault" element={<VaultScreen onOpenAuth={() => setAuthModalOpen(true)} />} />
          </Routes>
        </main>

        <MobileNav />

        {/* Global Modals */}
        <SlideshowModal isOpen={slideshowOpen} onClose={() => setSlideshowOpen(false)} />
        <AuthModal isOpen={authModalOpen} onClose={() => setAuthModalOpen(false)} />
      </div>
    );
  }

  // Render Root with MemoryRouter
  const root = createRoot(document.getElementById("root"));
  root.render(
    <MemoryRouter initialEntries={["/"]}>
      <App />
    </MemoryRouter>
  );
</script>

</body>
</html>
